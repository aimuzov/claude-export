name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Check the scripts
        run: shellcheck -s sh bin/claude.export tests/run.sh

  test:
    name: ${{ matrix.shell }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: dash
          - os: macos-latest
            shell: sh

    steps:
      - uses: actions/checkout@v5

      - name: Make sure jq, zip and unzip are present
        run: jq --version && command -v zip unzip

      # The shebang says sh, run it under the strictest shell on hand
      - name: Run the tests
        env:
          TEST_SHELL: ${{ matrix.shell }}
        run: |
          sed -i.bak "1s|.*|#!$(command -v "$TEST_SHELL")|" bin/claude.export
          "$TEST_SHELL" tests/run.sh

  fish:
    name: fish on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install fish from the release PPA
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:fish-shell/release-4
          sudo apt-get update
          sudo apt-get install -y fish

      - name: Install fish from homebrew
        if: runner.os == 'macOS'
        run: brew install fish

      - name: Check the syntax
        run: fish --no-config -n functions/*.fish completions/*.fish

      # The same cases as for bin/claude.export, run against the fish function
      - name: Run the tests
        run: sh tests/run.sh fish
