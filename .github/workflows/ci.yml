name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest

    steps:
      - name: Reuse verified CI
        id: verified
        uses: aimuzov/infra-ci/reuse-check@v1
        continue-on-error: true
        with:
          workflow: .github/workflows/ci.yml
      - uses: actions/checkout@v5
        if: steps.verified.outputs.reused != 'true'

      - name: Check the scripts
        run: shellcheck -s sh bin/claude.export tests/run.sh
        if: steps.verified.outputs.reused != 'true'
      - name: Record verified CI
        if: github.event_name == 'pull_request' && steps.verified.outputs.reused != 'true'
        uses: aimuzov/infra-ci/record-check@v1
        continue-on-error: true
        with:
          workflow: .github/workflows/ci.yml

  test:
    name: ${{ matrix.shell }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: dash
          - os: macos-latest
            shell: sh

    steps:
      - name: Reuse verified CI
        id: verified
        uses: aimuzov/infra-ci/reuse-check@v1
        continue-on-error: true
        with:
          workflow: .github/workflows/ci.yml
          matrix: ${{ toJSON(matrix) }}
      - uses: actions/checkout@v5
        if: steps.verified.outputs.reused != 'true'

      - name: Make sure jq, zip and unzip are present
        run: jq --version && command -v zip unzip
        if: steps.verified.outputs.reused != 'true'

      # The shebang says sh, run it under the strictest shell on hand
      - name: Run the tests
        env:
          TEST_SHELL: ${{ matrix.shell }}
        run: |
          sed -i.bak "1s|.*|#!$(command -v "$TEST_SHELL")|" bin/claude.export
          "$TEST_SHELL" tests/run.sh
        if: steps.verified.outputs.reused != 'true'
      - name: Record verified CI
        if: github.event_name == 'pull_request' && steps.verified.outputs.reused != 'true'
        uses: aimuzov/infra-ci/record-check@v1
        continue-on-error: true
        with:
          workflow: .github/workflows/ci.yml
          matrix: ${{ toJSON(matrix) }}

  fish:
    name: fish on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Reuse verified CI
        id: verified
        uses: aimuzov/infra-ci/reuse-check@v1
        continue-on-error: true
        with:
          workflow: .github/workflows/ci.yml
          matrix: ${{ toJSON(matrix) }}
      - uses: actions/checkout@v5
        if: steps.verified.outputs.reused != 'true'

      - name: Install fish from the release PPA
        if: steps.verified.outputs.reused != 'true' && (runner.os == 'Linux')
        run: |
          sudo add-apt-repository -y ppa:fish-shell/release-4
          sudo apt-get update
          sudo apt-get install -y fish

      - name: Install fish from homebrew
        if: steps.verified.outputs.reused != 'true' && (runner.os == 'macOS')
        run: brew install fish

      - name: Check the syntax
        run: fish --no-config -n functions/*.fish completions/*.fish
        if: steps.verified.outputs.reused != 'true'

      # The same cases as for bin/claude.export, run against the fish function
      - name: Run the tests
        run: sh tests/run.sh fish
        if: steps.verified.outputs.reused != 'true'
      - name: Record verified CI
        if: github.event_name == 'pull_request' && steps.verified.outputs.reused != 'true'
        uses: aimuzov/infra-ci/record-check@v1
        continue-on-error: true
        with:
          workflow: .github/workflows/ci.yml
          matrix: ${{ toJSON(matrix) }}
permissions:
  contents: read
  actions: read
  id-token: write
